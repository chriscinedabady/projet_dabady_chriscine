databases:
  - name: pollution-db
    databaseName: gestion_pollution
    user: pollution_user
    plan: free

services:
  # Backend API (Node.js / Express / Sequelize)
  - type: web
    name: apipollution
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pollution-db
          property: connectionString

  # Frontend Angular (Site statique)
  - type: web
    name: pollutionApp
    runtime: static
    buildCommand: cd Front && npm ci && npm run build
    staticPublishPath: ./Front/dist/Front/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
