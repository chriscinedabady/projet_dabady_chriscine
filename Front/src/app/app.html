<button
  type="button"
  class="hamburger"
  (click)="toggleSidebar()"
  [class.active]="sidebarOpen()"
  [attr.aria-expanded]="sidebarOpen()"
  aria-label="Ouvrir ou fermer le menu de navigation"
>
  <span></span>
  <span></span>
  <span></span>
</button>

@if (sidebarOpen()) {
  <div class="overlay" (click)="closeSidebar()"></div>
}

<nav class="sidebar" [class.open]="sidebarOpen()" aria-label="Navigation principale">
  <h3>Navigation</h3>
  @if (isAuthenticated()) {
    <a routerLink="/pollutions" routerLinkActive="active-link" (click)="closeSidebar()">Liste des pollutions</a>
    <a routerLink="/nouvelle-pollution" routerLinkActive="active-link" (click)="closeSidebar()">Déclarer une pollution</a>
  } @else {
    <a routerLink="/login" routerLinkActive="active-link" (click)="closeSidebar()">Connexion</a>
  }
  <a routerLink="/signup" routerLinkActive="active-link" (click)="closeSidebar()">Inscription</a>

  @if (currentUser(); as user) {
    <div class="sidebar-user">
      <p class="user-badge">Connecté : <strong>{{ user.username }}</strong></p>
      <button type="button" class="btn-logout" (click)="onLogout()">Se déconnecter</button>
    </div>
  }
</nav>

<main>
  <router-outlet></router-outlet>
</main>
