<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaire d'inscription</title>

  <link rel="stylesheet" href="style.css">
  <script type="module" src="form.js"></script>
</head>
<body>

    <!-- CECI N'EST PAS MON CODE-->
  <!-- Formulaire d'inscription -->
  <form id="registration-form" action="" method="post">
    <!-- Login -->
    <label for="login">Login</label>
    <input type="text" name="login" id="login" required />
    <p></p>
    
    <!-- Mot de passe -->
    <label for="password">Mot de passe</label>
    <input type="password" name="password" id="password" required />
    <p></p>

    <!-- Confirmation du mot de passe -->
    <label for="confirmed_password">Confirmation du mot de passe</label>
    <input type="password" name="confirmed_password" id="confirmed_password" required />
    <p></p>

    <!-- Nom -->
    <label for="lastname">Nom</label>
    <input type="text" name="lastname" id="lastname" required />
    <p></p>

    <!-- Prénom -->
    <label for="firstname">Prénom</label>
    <input type="text" name="firstname" id="firstname" required />
    <p></p>

    <!-- Adresse -->
    <label for="address">Adresse</label>
    <input type="text" name="address" id="address" required />
    <p></p>

    <!-- Email -->
    <label for="email">Email</label>
    <input type="email" name="email" id="email" required />
    <p></p>

    <!-- Téléphone -->
    <label for="phone">Téléphone</label>
    <input type="tel" name="phone" id="phone" required />
    <p></p>

    <!-- Date de naissance -->
    <label for="birthdate">Date de naissance</label>
    <input type="date" name="birthdate" id="birthdate" required />
    <p></p>

    <button type="submit">S'inscrire</button>
  </form>

  <!-- Section Récapitulative (masquée au départ) -->
  <div id="summary-card" class="summary-card" style="display: none;">
    <h1>Récapitulatif de votre inscription</h1>
    
    <div class="summary-item">
      <span class="label">Login :</span>
      <span class="value" id="res-login"></span>
    </div>
    
    <div class="summary-item">
      <span class="label">Nom :</span>
      <span class="value" id="res-lastname"></span>
    </div>
    
    <div class="summary-item">
      <span class="label">Prénom :</span>
      <span class="value" id="res-firstname"></span>
    </div>

    <div class="summary-item">
      <span class="label">Adresse :</span>
      <span class="value" id="res-address"></span>
    </div>

    <div class="summary-item">
      <span class="label">Email :</span>
      <span class="value" id="res-email"></span>
    </div>

    <div class="summary-item">
      <span class="label">Téléphone :</span>
      <span class="value" id="res-phone"></span>
    </div>

    <div class="summary-item">
      <span class="label">Date de naissance :</span>
      <span class="value" id="res-birthdate"></span>
    </div>
  </div>

</body>
</html>
